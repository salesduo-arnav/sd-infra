name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed paths
        id: changes
        run: |
          BACKEND_CHANGED=$(git diff --name-only HEAD~1 HEAD -- backend/ | head -1)
          FRONTEND_CHANGED=$(git diff --name-only HEAD~1 HEAD -- frontend/ | head -1)
          echo "backend=$( [ -n "$BACKEND_CHANGED" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "frontend=$( [ -n "$FRONTEND_CHANGED" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "Backend changed: $( [ -n "$BACKEND_CHANGED" ] && echo yes || echo no )"
          echo "Frontend changed: $( [ -n "$FRONTEND_CHANGED" ] && echo yes || echo no )"

  # ── Gate: detect whether a push is from a PR merge or a direct push ──
  detect-merge:
    name: Detect PR Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      is_merge: ${{ steps.check.outputs.is_merge }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSOCIATED_PRS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length' 2>/dev/null || echo "0")
          IS_MERGE=$( [ "$ASSOCIATED_PRS" -gt "0" ] && echo "true" || echo "false" )
          echo "is_merge=$IS_MERGE" >> "$GITHUB_OUTPUT"
          echo "Push by ${{ github.actor }}: associated PRs=$ASSOCIATED_PRS → is_merge=$IS_MERGE"

  lint-backend:
    name: Lint Backend
    needs: [detect-changes, detect-merge]
    if: >-
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.detect-merge.outputs.is_merge != 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run Lint
        working-directory: ./backend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../backend_lint_report.md

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-report
          path: backend_lint_report.md

  lint-frontend:
    name: Lint Frontend
    needs: [detect-changes, detect-merge]
    if: >-
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.detect-merge.outputs.is_merge != 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Lint
        working-directory: ./frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../frontend_lint_report.md

      - name: Build Check
        working-directory: ./frontend
        run: npm run build

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: ./frontend
        run: npx playwright test --reporter=list 2>&1 | tee ../frontend_e2e_report.md

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-report
          path: frontend_lint_report.md

  tests:
    name: E2E & Unit Tests
    needs: [detect-changes, detect-merge]
    if: >-
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.detect-merge.outputs.is_merge != 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env files
        run: |
          echo "${{ secrets.BACKEND_ENV_FILE }}" > backend/.env
          echo "${{ secrets.FRONTEND_ENV_FILE }}" > frontend/.env
          echo "${{ secrets.ROOT_ENV_FILE }}" > .env

      - name: Build Docker Images
        run: |
          docker compose build
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Start Services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          echo "Waiting for services to initialize..."
          sleep 15
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
      - name: Debug Containers
        if: always()
        run: |
          echo "=== Docker PS ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

          echo "=== All Containers ==="
          docker ps -a

          echo "=== Backend Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend || true

          echo "=== Postgres Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs postgres || true
      - name: Prepare Backend Test Database
        run: |
          echo "Waiting for Postgres to be ready..."
          until docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres pg_isready -U myuser -d mydb; do
            echo "Waiting for postgres..."
            sleep 2
          done
          echo "Creating test database 'mydb_test'..."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres psql -U myuser -d mydb -c "SELECT 1 FROM pg_database WHERE datname = 'mydb_test'" | grep -q 1 || docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres createdb -U myuser mydb_test

      - name: Run Backend Tests
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend npm test 2>&1 | tee backend_report.md

      # - name: Install Frontend Test Dependencies
      #   run: |
      #     sudo chown -R $(whoami) frontend
      #     cd frontend
      #     npm ci
      #     npx playwright install --with-deps

      # - name: Run Frontend Tests
      #   env:
      #     CI_DOCKER: "true"
      #   run: |
      #     cd frontend
      #     set -o pipefail
      #     npx playwright test 2>&1 | tee ../frontend_report.md

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend_report.md
            frontend_report.md

  report:
    name: Generate CML Report
    needs: [detect-changes, detect-merge, lint-backend, lint-frontend, tests]
    if: >-
      always() && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.detect-merge.outputs.is_merge != 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Generate Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summarize_jest() {
            local file="$1"
            if [ -s "$file" ]; then
              grep -E "^(Test Suites:|Tests:|Snapshots:|Time:)" "$file" || tail -5 "$file"
            else
              echo "Not run."
            fi
          }
          summarize_lint() {
            local file="$1"
            if [ -s "$file" ]; then
              if grep -qE "problem" "$file"; then
                grep -E "problem" "$file" | tail -1
              else
                echo "Clean — no lint issues."
              fi
            else
              echo "Not run."
            fi
          }

          {
            echo "## CI Summary"
            echo ""
            echo "### Backend Tests"
            echo '```'
            summarize_jest test-reports/backend_report.md
            echo '```'
            echo ""
            echo "### Backend Lint"
            echo '```'
            summarize_lint backend-lint-report/backend_lint_report.md
            echo '```'
            echo ""
            echo "### Frontend Lint"
            echo '```'
            summarize_lint frontend-lint-report/frontend_lint_report.md
            echo '```'
            echo ""
            echo "_Full logs available in this run's workflow artifacts._"
          } > report.md

          cml comment create report.md

  cd-staging:
    name: Deploy to Staging
    needs: [detect-changes, detect-merge, lint-backend, lint-frontend, tests]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true') &&
      (
        needs.detect-merge.outputs.is_merge == 'true' ||
        (
          (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped') &&
          (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped') &&
          (needs.tests.result == 'success' || needs.tests.result == 'skipped')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      APP_SERVICE_NAME: ${{ vars.APP_SERVICE_NAME }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG || 'test' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'sd-core-platform' }}
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        if: env.BACKEND_CHANGED == 'true'
        run: |
          BACKEND_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}/backend:${{ env.IMAGE_TAG }}"
          docker build -t "$BACKEND_URI" ./backend
          docker push "$BACKEND_URI"

      - name: Build and Push Frontend Image
        if: env.FRONTEND_CHANGED == 'true'
        run: |
          FRONTEND_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}/frontend:${{ env.IMAGE_TAG }}"
          docker build -t "$FRONTEND_URI" \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_MIXPANEL_TOKEN="${{ secrets.VITE_MIXPANEL_TOKEN }}" \
            ./frontend
          docker push "$FRONTEND_URI"

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.APP_SERVICE_NAME }}" --force-new-deployment --region "${{ env.AWS_REGION }}"
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Verify deployment
        run: |
          echo "=== Task Count ==="
          RUNNING=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --query "services[0].deployments[0].runningCount" --output text --region "${{ env.AWS_REGION }}")
          DESIRED=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --query "services[0].deployments[0].desiredCount" --output text --region "${{ env.AWS_REGION }}")
          echo "Tasks: $RUNNING/$DESIRED"
          [ "$RUNNING" -ge 1 ] || { echo "::error::No tasks running"; exit 1; }

          echo "=== Health Checks ==="
          API_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://api-test.salesduo.com/health)
          echo "API health: $API_STATUS"
          [ "$API_STATUS" = "200" ] || { echo "::error::API health check failed ($API_STATUS)"; exit 1; }

          FE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://app-test.salesduo.com)
          echo "Frontend: $FE_STATUS"
          [ "$FE_STATUS" = "200" ] || { echo "::error::Frontend health check failed ($FE_STATUS)"; exit 1; }

          echo "=== Frontend Integrity ==="
          BODY=$(curl -sk https://app-test.salesduo.com)
          echo "$BODY" | grep -qi "error" && { echo "::warning::Frontend HTML contains 'error'"; } || echo "No errors in HTML"
          [ ${#BODY} -gt 100 ] || { echo "::error::Frontend returned empty/minimal response"; exit 1; }

          echo "=== Env Var Check ==="
          TASK_DEF=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --query 'services[0].taskDefinition' --output text --region "${{ env.AWS_REGION }}")
          CONTAINER=$(aws ecs describe-task-definition --task-definition "$TASK_DEF" --region "${{ env.AWS_REGION }}" --query 'taskDefinition.containerDefinitions[0]' --output json)

          for VAR in PGHOST REDIS_URL CORS_ORIGINS FRONTEND_URL COOKIE_DOMAIN; do
            echo "$CONTAINER" | python3 -c "import sys,json; d=json.load(sys.stdin); assert any(e['name']=='$VAR' for e in d.get('environment',[])), '$VAR missing'" 2>&1 || echo "::warning::$VAR not found in env"
          done

          for SECRET in PGPASSWORD JWT_SECRET GOOGLE_CLIENT_ID ENCRYPTION_KEY INTERNAL_API_KEY MIXPANEL_TOKEN; do
            echo "$CONTAINER" | python3 -c "import sys,json; d=json.load(sys.stdin); assert any(e['name']=='$SECRET' for e in d.get('secrets',[])), '$SECRET missing'" 2>&1 || echo "::warning::$SECRET not found in secrets"
          done

          echo "✅ Staging verification complete"

  cd-production:
    name: Deploy to Production
    needs: [detect-changes, detect-merge, lint-backend, lint-frontend, tests]
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true') &&
      (
        needs.detect-merge.outputs.is_merge == 'true' ||
        (
          (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped') &&
          (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped') &&
          (needs.tests.result == 'success' || needs.tests.result == 'skipped')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECS_CLUSTER: ${{ vars.PROD_ECS_CLUSTER }}
      APP_SERVICE_NAME: ${{ vars.PROD_APP_SERVICE_NAME }}
      IMAGE_TAG: ${{ vars.PROD_IMAGE_TAG || 'prod' }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME || 'sd-core-platform' }}
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image
        if: env.BACKEND_CHANGED == 'true'
        run: |
          BACKEND_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}/backend:${{ env.IMAGE_TAG }}"
          docker build -t "$BACKEND_URI" ./backend
          docker push "$BACKEND_URI"

      - name: Build and Push Frontend Image
        if: env.FRONTEND_CHANGED == 'true'
        run: |
          FRONTEND_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}/frontend:${{ env.IMAGE_TAG }}"
          docker build -t "$FRONTEND_URI" \
            --build-arg VITE_API_BASE_URL="${{ secrets.PROD_VITE_API_BASE_URL }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.PROD_VITE_GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY="${{ secrets.PROD_VITE_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_MIXPANEL_TOKEN="${{ secrets.PROD_VITE_MIXPANEL_TOKEN }}" \
            ./frontend
          docker push "$FRONTEND_URI"

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ env.APP_SERVICE_NAME }}" --force-new-deployment --region "${{ env.AWS_REGION }}"
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Verify deployment
        run: |
          echo "=== Task Count ==="
          RUNNING=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --query "services[0].deployments[0].runningCount" --output text --region "${{ env.AWS_REGION }}")
          DESIRED=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --query "services[0].deployments[0].desiredCount" --output text --region "${{ env.AWS_REGION }}")
          echo "Tasks: $RUNNING/$DESIRED"
          [ "$RUNNING" -ge 1 ] || { echo "::error::No tasks running"; exit 1; }

          echo "=== Health Checks ==="
          API_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://api.salesduo.com/health)
          echo "API health: $API_STATUS"
          [ "$API_STATUS" = "200" ] || { echo "::error::API health check failed ($API_STATUS)"; exit 1; }

          FE_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://app.salesduo.com)
          echo "Frontend: $FE_STATUS"
          [ "$FE_STATUS" = "200" ] || { echo "::error::Frontend health check failed ($FE_STATUS)"; exit 1; }

          echo "=== Frontend Integrity ==="
          BODY=$(curl -sk https://app.salesduo.com)
          echo "$BODY" | grep -qi "error" && { echo "::warning::Frontend HTML contains 'error'"; } || echo "No errors in HTML"
          [ ${#BODY} -gt 100 ] || { echo "::error::Frontend returned empty/minimal response"; exit 1; }

          echo "=== Env Var Check ==="
          TASK_DEF=$(aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.APP_SERVICE_NAME }}" --query 'services[0].taskDefinition' --output text --region "${{ env.AWS_REGION }}")
          CONTAINER=$(aws ecs describe-task-definition --task-definition "$TASK_DEF" --region "${{ env.AWS_REGION }}" --query 'taskDefinition.containerDefinitions[0]' --output json)

          for VAR in PGHOST REDIS_URL CORS_ORIGINS FRONTEND_URL COOKIE_DOMAIN; do
            echo "$CONTAINER" | python3 -c "import sys,json; d=json.load(sys.stdin); assert any(e['name']=='$VAR' for e in d.get('environment',[])), '$VAR missing'" 2>&1 || echo "::warning::$VAR not found in env"
          done

          for SECRET in PGPASSWORD JWT_SECRET GOOGLE_CLIENT_ID ENCRYPTION_KEY INTERNAL_API_KEY MIXPANEL_TOKEN; do
            echo "$CONTAINER" | python3 -c "import sys,json; d=json.load(sys.stdin); assert any(e['name']=='$SECRET' for e in d.get('secrets',[])), '$SECRET missing'" 2>&1 || echo "::warning::$SECRET not found in secrets"
          done

          echo "✅ Production verification complete"
