events {}

http {
    # 1. DOCKER DNS RESOLVER (CRITICAL)
    # This allows Nginx to start even if upstream containers are down.
    # It checks DNS every 10 seconds.
    resolver 127.0.0.11 valid=10s;

    # ==========================================
    # DEFAULT SERVER (BLOCK ALL)
    # ==========================================
    # server {
    #     listen 80 default_server;
    #     server_name _;
    #     return 444;
    # }

    # ==========================================
    # CORE API (Auth, Billing)
    # ==========================================
    server {
        listen 80;
        server_name api.lvh.me;

        location / {
            # Use a variable to force Nginx to use the resolver (dynamic DNS)
            set $upstream_backend core-backend;
            proxy_pass http://$upstream_backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }
    }

    # ==========================================
    # DASHBOARD UI
    # ==========================================
    server {
        listen 80;
        server_name app.lvh.me;

        location / {
            set $upstream_frontend core-frontend;
            proxy_pass http://$upstream_frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ==========================================
    # MICRO APP: Creatives Micro Tool
    # Domain: creatives.lvh.me
    # ==========================================
    server {
        listen 80;
        server_name creatives.lvh.me;

        # Allow large file uploads (images, reference ZIPs, etc.)
        client_max_body_size 512M;

        # 1. Route API requests to FastAPI
        location /api/ {
            set $creatives_backend "creatives-prod-backend";
            proxy_pass http://$creatives_backend:8000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Connection '';

            # SSE: disable buffering so events stream immediately
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 900s;
        }

        # 2. Route all other requests to React Frontend
        location / {
            set $creatives_frontend "creatives-prod-frontend";
            proxy_pass http://$creatives_frontend:8081;
            
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}